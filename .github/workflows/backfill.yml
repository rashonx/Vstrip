name: Add older versions to the Releases page

# One-off job: rebuilds each older version from the exact code it was made from and publishes it
# as its own release (never marked "Latest"), so every version shows under "Older versions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { slug: soul-keys, name: "Rashon Soul Keys", target: SoulKeys, version: "1.0.0", commit: 4119b54 }
          - { slug: soul-keys, name: "Rashon Soul Keys", target: SoulKeys, version: "1.1.0", commit: 26bcb42 }
          - { slug: soul-keys, name: "Rashon Soul Keys", target: SoulKeys, version: "1.2.0", commit: 3c3dfe6 }
          - { slug: soul-keys, name: "Rashon Soul Keys", target: SoulKeys, version: "1.3.0", commit: b89babf }
          - { slug: soul-keys, name: "Rashon Soul Keys", target: SoulKeys, version: "1.3.1", commit: 204dead }
          - { slug: vocal-sitter, name: "Rashon Vocal Sitter", target: VocalSitter, version: "1.0.0", commit: 797892b }
          - { slug: vocal-sitter, name: "Rashon Vocal Sitter", target: VocalSitter, version: "2.1.0", commit: 2df8760 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0

      - name: Skip if this version is already on the Releases page
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ matrix.slug }}-v${{ matrix.version }}" --repo "${{ github.repository }}" *> $null
          "found=$([int]($LASTEXITCODE -eq 0))" >> $env:GITHUB_OUTPUT

      - name: Configure
        if: steps.exists.outputs.found == '0'
        run: cmake -B build -A x64

      - name: Build
        if: steps.exists.outputs.found == '0'
        run: cmake --build build --config Release --target ${{ matrix.target }}_VST3 ${{ matrix.target }}_Standalone

      - name: Package and publish
        if: steps.exists.outputs.found == '0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ matrix.version }}"
          $name = "${{ matrix.name }}"
          $folder = "dist/$name v$v"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item -Recurse "build/${{ matrix.target }}_artefacts/Release/VST3/$name.vst3" "$folder/"
          Copy-Item "build/${{ matrix.target }}_artefacts/Release/Standalone/$name.exe" "$folder/"
          if (Test-Path docs/INSTALL.txt) { Copy-Item docs/INSTALL.txt "$folder/INSTALL.txt" }
          if (Test-Path "Bonus Presets") { Copy-Item -Recurse "Bonus Presets" "$folder/Bonus Presets" }
          $tag = "${{ matrix.slug }}-v$v"
          $zip = "$($name -replace ' ', '-')-v$v-Windows.zip"
          Compress-Archive -Path $folder -DestinationPath $zip -Force
          $notes = "Older version, rebuilt from the exact code of v$v. Download **$zip** below (under Assets) and unzip it.`n`nCopy the **$name.vst3** folder into ``C:\\Program Files\\Common Files\\VST3\\`` (replace the current one), then rescan plugins in your DAW."
          gh release create $tag $zip --repo "${{ github.repository }}" --target "$(git rev-parse HEAD)" --title "$name v$v" --notes $notes --latest=false
