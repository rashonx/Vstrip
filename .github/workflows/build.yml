name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target VocalStrip_VST3 VocalStrip_Standalone

      - name: Read version
        id: version
        shell: bash
        run: echo "number=$(grep -oP 'project\(VocalStrip VERSION \K[0-9.]+' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Package (version number on the folder; plugin files keep their normal names)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.number }}"
          $name = "Rashon X Vocal"
          $folder = "dist/$name v$v"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item -Recurse "build/VocalStrip_artefacts/Release/VST3/$name.vst3" "$folder/"
          Copy-Item "build/VocalStrip_artefacts/Release/Standalone/$name.exe" "$folder/"
          Copy-Item docs/INSTALL.txt "$folder/INSTALL.txt"

      - name: Load test with pluginval
        id: loadtest
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $bundle = (Get-ChildItem dist -Recurse -Filter *.vst3 -Directory | Select-Object -First 1).FullName
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 120000 "$bundle"
          exit $LASTEXITCODE

      - name: Publish to the Releases page
        if: github.event_name == 'push' && steps.loadtest.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.number }}"
          $name = "Rashon X Vocal"
          $tag = "x-vocal-v$v"
          $zip = "$($name -replace ' ', '-')-v$v-Windows.zip"
          Compress-Archive -Path "dist/$name v$v" -DestinationPath $zip -Force
          $notes = "Download **$zip** below (under Assets), unzip it, and follow INSTALL / SETUP inside.`n`nCopy the **Rashon X Vocal.vst3** folder into ``C:\\Program Files\\Common Files\\VST3\\`` (replace the old one), then rescan plugins in your DAW."
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$name v$v" --notes $notes
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RashonXVocal-Windows-v${{ steps.version.outputs.number }}
          path: dist/

  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxi-dev libxext-dev libfreetype-dev libfontconfig1-dev ninja-build
      - name: Build and run smoke test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOCALSTRIP_BUILD_TESTS=ON
          cmake --build build --target VocalStripSmokeTest
          ./build/VocalStripSmokeTest
