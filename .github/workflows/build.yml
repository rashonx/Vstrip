name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target SoulKeys_VST3 SoulKeys_Standalone

      - name: Read version
        id: version
        shell: bash
        run: echo "number=$(grep -oP 'project\(RashonSoulKeys VERSION \K[0-9.]+' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Package (version number in the file names)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.number }}"
          $name = "Rashon Soul Keys"
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundle = "dist/$name v$v.vst3"
          Copy-Item -Recurse "build/SoulKeys_artefacts/Release/VST3/$name.vst3" $bundle
          # The plugin file inside the bundle must have the same name as the bundle
          Get-ChildItem "$bundle/Contents" -Recurse -File -Filter "$name.vst3" | Rename-Item -NewName "$name v$v.vst3"
          Copy-Item "build/SoulKeys_artefacts/Release/Standalone/$name.exe" "dist/$name v$v.exe"
          Copy-Item docs/INSTALL.txt "dist/INSTALL v$v.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: RashonSoulKeys-Windows-v${{ steps.version.outputs.number }}
          path: dist/

  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxi-dev libxext-dev libfreetype-dev libfontconfig1-dev ninja-build
      - name: Build and run smoke test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSOULKEYS_BUILD_TESTS=ON
          cmake --build build --target SoulKeysSmokeTest
          ./build/SoulKeysSmokeTest
