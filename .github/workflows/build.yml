name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target VocalStrip_VST3 VocalStrip_Standalone

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/VocalStrip_artefacts/Release/VST3/VocalStrip.vst3 dist/
          Copy-Item build/VocalStrip_artefacts/Release/Standalone/VocalStrip.exe dist/
          Copy-Item docs/INSTALL.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: VocalStrip-Windows
          path: dist/

  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxi-dev libxext-dev libfreetype-dev libfontconfig1-dev ninja-build
      - name: Build and run smoke test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVOCALSTRIP_BUILD_TESTS=ON
          cmake --build build --target VocalStripSmokeTest
          ./build/VocalStripSmokeTest
