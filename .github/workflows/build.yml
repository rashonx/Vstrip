name: Build Wheel Bridge

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: bash
        run: echo "number=$(grep -oP '<Version>\K[0-9.]+' src/WheelBridge.csproj)" >> "$GITHUB_OUTPUT"

      - name: Build single-file app
        run: dotnet publish src/WheelBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.number }}"
          Get-ChildItem dist -Filter *.pdb | Remove-Item
          Rename-Item dist/WheelBridge.exe "WheelBridge v$v.exe"
          Copy-Item SETUP.txt "dist/SETUP v$v.txt"

      - name: Publish to the Releases page
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.number }}"
          $name = "Wheel Bridge"
          $tag = "wheel-bridge-v$v"
          $zip = "$($name -replace ' ', '-')-v$v-Windows.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $zip -Force
          $notes = "Download **$zip** below (under Assets), unzip it, and follow INSTALL / SETUP inside.`n`nInstall ViGEmBus and HidHide first (links in SETUP), then run the WheelBridge .exe."
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$name v$v" --notes $notes
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WheelBridge-Windows-v${{ steps.version.outputs.number }}
          path: dist/
